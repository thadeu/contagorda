# Two threads, not the gem's three.
#
# The queue runs in Puma's process (see puma.rb) and draws from the same pool of
# connections as the request threads — five of them. Two workers, the dispatcher
# and the heartbeat fit beside a request or two; three workers would leave
# requests waiting for a connection while a job holds the others.
#
# The only job is copying a month, which takes a second or two, so nothing here
# needs to be wider.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 2
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

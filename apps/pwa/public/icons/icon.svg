<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#5aa9ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#ffffff"/>

  <g stroke="#0a0f1a" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears: round and floppy, leaning outwards -->
    <rect x="96" y="92" width="92" height="132" rx="46" fill="#f7efe6" transform="rotate(-38 142 158)"/>
    <rect x="324" y="92" width="92" height="132" rx="46" fill="#f7efe6" transform="rotate(38 370 158)"/>
    <!-- head: chubby, wider at the cheeks -->
    <path d="M256 128 C338 128 392 186 400 262 C408 336 372 400 256 400 C140 400 104 336 112 262 C120 186 174 128 256 128 Z" fill="#f2748c"/>
    <!-- snout -->
    <rect x="186" y="256" width="140" height="102" rx="51" fill="#f7efe6"/>
  </g>
  <!-- nostrils -->
  <ellipse cx="228" cy="307" rx="13" ry="18" fill="#0a0f1a"/>
  <ellipse cx="284" cy="307" rx="13" ry="18" fill="#0a0f1a"/>
  <!-- eyes -->
  <ellipse cx="204" cy="218" rx="12" ry="17" fill="#0a0f1a"/>
  <ellipse cx="308" cy="218" rx="12" ry="17" fill="#0a0f1a"/>
  <!-- cheek blush -->
  <circle cx="158" cy="284" r="16" fill="#ffffff" opacity="0.28"/>
  <circle cx="354" cy="284" r="16" fill="#ffffff" opacity="0.28"/>
</svg>

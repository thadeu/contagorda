<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0c0f18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Conta Gorda" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>Conta Gorda</title>
  </head>
  <body>
    <div style='height: var(--h-status-bar); background: var(--bg-appshell)'></div>

    <!--
      What the page looks like before React mounts. Mirrors WelcomeFrame.tsx in
      both of its layouts — the phone column and the desktop split — so the
      first paint is already the screen React is about to draw, and mounting it
      changes nothing but the card details. Those are skeleton bars here, in
      the places the real text takes, and the real text fades in over them.

      The desktop query is the one in src/app/useIsDesktop.ts. If either
      changes, change both, or the page opens in one layout and jumps to the
      other.
    -->
    <style>
      #root:has(> .boot) { background: #fff; }

      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; margin: 0 auto; max-width: 32rem; overflow: hidden; background: #fff; color: #16130f; font-family: 'Instrument Sans', system-ui, sans-serif; }
      .boot-art { display: contents; }
      .boot-stack { position: relative; flex-shrink: 0; margin-top: calc(env(safe-area-inset-top) + 1rem); --card-w: min(72vw, 24rem, 40svh); --card-h: calc(var(--card-w) / 1.58); height: calc(var(--card-h) * 1.6 + var(--card-w) * .22); }

      .boot-card { position: absolute; width: var(--card-w); height: var(--card-h); border-radius: 1.25rem; transform: rotate(-14deg) skewX(-10deg); box-shadow: 0 24px 48px -24px rgb(12 15 24 / .35); }
      .boot-back { top: calc(var(--card-h) * .58); right: -6vw; background: #1f6f6b; opacity: .85; }
      .boot-mid { top: calc(var(--card-h) * .36); right: -10vw; background: #1b1d28; }
      .boot-front { top: calc(var(--card-h) * .14); right: -14vw; background: linear-gradient(135deg, #f7a1b3 0%, #ef7a92 55%, #e2617c 100%); }

      .boot-pig { position: absolute; top: 10%; left: 8%; width: 18%; }
      .boot-bone { position: absolute; border-radius: 9999px; background: rgb(255 255 255 / .24); animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot-brandline { top: 13%; right: 8%; width: 24%; height: calc(var(--card-w) * .042); }
      .boot-chip { top: 36%; left: 8%; width: 14%; height: 16%; border-radius: 18%; }
      .boot-number { top: 61%; left: 8%; width: 70%; height: calc(var(--card-w) * .048); }
      .boot-label { bottom: calc(9% + var(--card-w) * .06); width: 13%; height: calc(var(--card-w) * .026); }
      .boot-value { bottom: 9%; width: 20%; height: calc(var(--card-w) * .04); }
      .boot-field-1 { left: 8%; }
      .boot-field-2 { left: 36%; }
      .boot-mark { bottom: 9%; right: 8%; width: calc(var(--card-w) * .16); height: calc(var(--card-w) * .1); }

      .boot-copy { display: flex; flex: 1; flex-direction: column; justify-content: flex-end; padding: 1rem 1.75rem calc(env(safe-area-inset-bottom) + 1.25rem); }
      .boot-brand { display: none; }
      .boot-body { display: contents; }
      .boot-title { margin: 0; max-width: 12ch; font-size: 2rem; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; }
      .boot-desc { margin: .75rem 0 0; max-width: 30ch; font-size: .9375rem; line-height: 1.625; color: #78706a; }
      .boot-actions { box-sizing: border-box; min-height: 6.25rem; padding-top: 1.5rem; }
      .boot-loader { display: flex; min-height: 3rem; align-items: center; justify-content: center; }
      .boot-secured { display: flex; align-items: center; justify-content: center; gap: .375rem; margin: .5rem 0 0; font-size: .75rem; color: #aaa198; }

      @media (max-height: 640px) { .boot-desc { display: none; } }

      @media (min-width: 1024px) and (pointer: fine) {
        .boot { display: grid; grid-template-columns: minmax(26rem, 36rem) 1fr; max-width: none; }
        .boot-art { display: block; position: relative; order: 2; overflow: hidden; background: #f4f0eb; }
        .boot-stack { position: absolute; inset: 0; margin: 0; height: auto; --card-w: min(34vw, 32rem, 55vh); --stack-x: calc(50% - var(--card-w) / 2); --stack-y: calc(50% - var(--card-h) * .8); }
        .boot-front { top: var(--stack-y); right: calc(var(--stack-x) - var(--card-w) * .12); }
        .boot-mid { top: calc(var(--stack-y) + var(--card-h) * .22); right: var(--stack-x); }
        .boot-back { top: calc(var(--stack-y) + var(--card-h) * .44); right: calc(var(--stack-x) + var(--card-w) * .12); }

        .boot-copy { justify-content: flex-start; overflow-y: auto; padding: 3rem 3.5rem; }
        .boot-brand { display: flex; align-items: center; gap: .875rem; font-size: 1.5rem; line-height: 2rem; font-weight: 700; letter-spacing: -.02em; }
        .boot-brand svg { width: 3.5rem; height: 3.5rem; }
        .boot-body { display: flex; flex: 1; flex-direction: column; justify-content: center; max-width: 22rem; padding: 2.5rem 0; }
        .boot-title { max-width: none; font-size: 2.5rem; line-height: 1.05; letter-spacing: -.025em; }
        .boot-desc { display: block; max-width: none; margin-top: 1rem; font-size: 1rem; }
        .boot-actions { min-height: 8rem; padding-top: 2rem; }
        .boot-secured { justify-content: flex-start; margin: 0; }
      }

      @keyframes boot-pulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
      @keyframes boot-blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
      .boot-eye { transform-box: fill-box; transform-origin: center; animation: boot-blink 3s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) { .boot-bone, .boot-eye { animation: none; } }
    </style>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
      <g id="boot-pig">
        <g stroke="#0a0f1a" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
          <rect x="96" y="92" width="92" height="132" rx="46" fill="#f7efe6" transform="rotate(-38 142 158)"/>
          <rect x="324" y="92" width="92" height="132" rx="46" fill="#f7efe6" transform="rotate(38 370 158)"/>
          <path d="M256 128 C338 128 392 186 400 262 C408 336 372 400 256 400 C140 400 104 336 112 262 C120 186 174 128 256 128 Z" fill="#f2748c"/>
          <rect x="186" y="256" width="140" height="102" rx="51" fill="#f7efe6"/>
        </g>
        <ellipse cx="228" cy="307" rx="13" ry="18" fill="#0a0f1a"/>
        <ellipse cx="284" cy="307" rx="13" ry="18" fill="#0a0f1a"/>
        <ellipse class="boot-eye" cx="204" cy="218" rx="12" ry="17" fill="#0a0f1a"/>
        <ellipse class="boot-eye" cx="308" cy="218" rx="12" ry="17" fill="#0a0f1a"/>
        <circle cx="158" cy="284" r="16" fill="#fff" opacity=".28"/>
        <circle cx="354" cy="284" r="16" fill="#fff" opacity=".28"/>
      </g>
      </defs>
    </svg>

    <div id="root">
      <div class="boot">
        <div class="boot-art" aria-hidden="true">
          <div class="boot-stack">
            <div class="boot-card boot-back">
              <svg class="boot-pig" viewBox="64 64 384 384"><use href="#boot-pig"/></svg>
              <span class="boot-bone boot-brandline"></span>
              <span class="boot-bone boot-chip"></span>
              <span class="boot-bone boot-number"></span>
              <span class="boot-bone boot-label boot-field-1"></span>
              <span class="boot-bone boot-value boot-field-1"></span>
              <span class="boot-bone boot-label boot-field-2"></span>
              <span class="boot-bone boot-value boot-field-2"></span>
              <span class="boot-bone boot-mark"></span>
            </div>
            <div class="boot-card boot-mid">
              <svg class="boot-pig" viewBox="64 64 384 384"><use href="#boot-pig"/></svg>
              <span class="boot-bone boot-brandline"></span>
              <span class="boot-bone boot-chip"></span>
              <span class="boot-bone boot-number"></span>
              <span class="boot-bone boot-label boot-field-1"></span>
              <span class="boot-bone boot-value boot-field-1"></span>
              <span class="boot-bone boot-label boot-field-2"></span>
              <span class="boot-bone boot-value boot-field-2"></span>
              <span class="boot-bone boot-mark"></span>
            </div>
            <div class="boot-card boot-front">
              <svg class="boot-pig" viewBox="64 64 384 384"><use href="#boot-pig"/></svg>
              <span class="boot-bone boot-brandline"></span>
              <span class="boot-bone boot-chip"></span>
              <span class="boot-bone boot-number"></span>
              <span class="boot-bone boot-label boot-field-1"></span>
              <span class="boot-bone boot-value boot-field-1"></span>
              <span class="boot-bone boot-label boot-field-2"></span>
              <span class="boot-bone boot-value boot-field-2"></span>
              <span class="boot-bone boot-mark"></span>
            </div>
          </div>
        </div>

        <div class="boot-copy">
          <div class="boot-brand">
            <svg viewBox="64 64 384 384" aria-hidden="true"><use href="#boot-pig"/></svg>
            <span>Conta Gorda</span>
          </div>

          <div class="boot-body">
            <h1 class="boot-title">Bem-vindo ao Conta Gorda</h1>
            <p class="boot-desc">Lance o que entra e o que sai, marque o que já pagou, e veja quanto ainda falta.</p>
            <div class="boot-actions">
              <div class="boot-loader">
                <svg viewBox="64 64 384 384" role="status" aria-label="Carregando" style="width:4rem;height:4rem">
                  <g stroke="#0a0f1a" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
                    <path d="M256 128 C338 128 392 186 400 262 C408 336 372 400 256 400 C140 400 104 336 112 262 C120 186 174 128 256 128 Z" fill="#f2748c"/>
                    <rect x="96" y="92" width="92" height="132" rx="46" fill="#f7efe6" transform="rotate(-38 142 158)"/>
                    <rect x="324" y="92" width="92" height="132" rx="46" fill="#f7efe6" transform="rotate(38 370 158)"/>
                    <rect x="186" y="256" width="140" height="102" rx="51" fill="#f7efe6"/>
                  </g>
                  <ellipse cx="204" cy="218" rx="12" ry="17" fill="#0a0f1a"/>
                  <ellipse cx="308" cy="218" rx="12" ry="17" fill="#0a0f1a"/>
                  <ellipse cx="228" cy="307" rx="13" ry="18" fill="#0a0f1a"/>
                  <ellipse cx="284" cy="307" rx="13" ry="18" fill="#0a0f1a"/>
                </svg>
              </div>
            </div>
          </div>

          <p class="boot-secured">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Secured by <span style="font-weight:500;color:#78706a">Clowk.in</span></span>
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

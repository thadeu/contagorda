<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover lets the layout reach under the iOS status bar, which
         is what the safe-area padding in the shell then accounts for. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />

    <!-- Matches --color-canvas. A mismatch here shows as a seam above the header
         once the app is installed. -->
    <meta name="theme-color" content="#f4f5f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent puts the web view under the status bar, so a full-screen
         overlay dims the whole display instead of stopping below the clock. iOS
         draws the status bar text white in this mode, which is why the top of
         every screen carries the brand colour. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Conta Gorda" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Conta Gorda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

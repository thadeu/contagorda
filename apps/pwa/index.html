<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover lets the layout reach under the iOS status bar, which
         is what the safe-area padding in the shell then accounts for. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />

    <!-- Matches --color-canvas. A mismatch here shows as a seam above the header
         once the app is installed. -->
    <meta name="theme-color" content="#f4f5f3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, not black-translucent. The latter puts the view under the
         status bar, but iOS then draws the clock in white, which forces a dark
         band across the top of every screen — and a curved dark header is a
         dated shape. A light header is worth more than an overlay reaching the
         last 40px of the display. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Conta Gorda" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Conta Gorda</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

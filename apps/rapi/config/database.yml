# Dev and test run against the Postgres 18 container from docker-compose.yml,
# on 5433 so it does not collide with a Postgres the developer already has on
# 5432. 18 is not optional: ids default to `uuidv7()`, which arrived in that
# version.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "127.0.0.1") %>
  port: <%= ENV.fetch("PGPORT", 5433) %>
  username: <%= ENV.fetch("PGUSER", "contagorda") %>
  password: <%= ENV.fetch("PGPASSWORD", "contagorda") %>

development:
  <<: *default
  database: contagorda_development

# TEST_ENV_NUMBER is what keeps parallel workers off each other's data: worker 2
# gets contagorda_test2, and so on. It is empty for worker 1 and for a plain
# `rspec` run, so both paths keep working.
test:
  <<: *default
  database: contagorda_test<%= ENV["TEST_ENV_NUMBER"] %>

# Production is driven entirely by DATABASE_URL, seeded through
# `vd config contagorda/api set DATABASE_URL=...`. Postgres lives on a separate
# VM reachable over the private network, so no credential belongs in this file.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
